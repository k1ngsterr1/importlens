[project]
name = "importlens"
version = "0.1.0"
description = "Review and apply vendor CSV price updates with a reversible catalog history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.13,<3",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "polars>=1.30,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "python-multipart>=0.0.26,<1",
    "redis>=6,<9",
    "uvicorn>=0.34,<1",
]

[project.scripts]
importlens = "importlens.cli:main"

[dependency-groups]
dev = ["httpx2>=2,<3", "mypy>=1.15,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importlens"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
